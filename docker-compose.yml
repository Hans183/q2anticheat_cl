services:
  anticheat:
    build: .
    container_name: q2pro-anticheat
    ports:
      - "27915:27915/tcp"
      - "27916:27916/tcp"
    volumes:
      - ac-data:/app/data
    restart: unless-stopped
    environment:
      - TZ=UTC
      # Admin credentials (override via Coolify env vars)
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
      # VAPID keys for Web Push — set these in Coolify so they survive redeploys.
      # If unset, keys are auto-generated and stored in the DB (requires persistent volume).
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBSCRIBER=${VAPID_SUBSCRIBER:-mailto:admin@q2anticheat.com}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:27916"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ac-data:
    driver: local