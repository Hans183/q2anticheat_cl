<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="logoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e2e"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="logoSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="reticleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left: Sniper Scope Crosshair Reticle -->
  <g transform="translate(60, 60)">
    <!-- Outer Red Ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#logoRed)" stroke-width="6" filter="url(#reticleGlow)"/>

    <!-- Inner Grey Ring -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="14 7"/>

    <!-- Crosshair Ticks -->
    <!-- Top -->
    <line x1="0" y1="-56" x2="0" y2="-28" stroke="#ef4444" stroke-width="6" stroke-linecap="square"/>
    <!-- Bottom -->
    <line x1="0" y1="28" x2="0" y2="56" stroke="#ef4444" stroke-width="6" stroke-linecap="square"/>
    <!-- Left -->
    <line x1="-56" y1="0" x2="-28" y2="0" stroke="#ef4444" stroke-width="6" stroke-linecap="square"/>
    <!-- Right (pointing towards text) -->
    <line x1="28" y1="0" x2="54" y2="0" stroke="#ef4444" stroke-width="6" stroke-linecap="square"/>

    <!-- Center Aim Point -->
    <circle cx="0" cy="0" r="4" fill="#ef4444"/>
  </g>

  <!-- Right: Bold Tactical Typography -->
  <g transform="translate(118, 0)">
    <!-- DDAY Text -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Impact, 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#logoRed)" letter-spacing="1">DDAY</text>
    
    <!-- Bullet Silhouette between DDAY and AC -->
    <g transform="translate(162, 28) scale(0.38)">
      <path d="M 12,0 C 18,0 24,18 24,40 L 24,75 L 0,75 L 0,40 C 0,18 6,0 12,0 Z" fill="#94a3b8"/>
      <rect x="0" y="78" width="24" height="30" fill="#64748b"/>
      <rect x="-2" y="110" width="28" height="6" rx="2" fill="#cbd5e1"/>
    </g>

    <!-- AC Text -->
    <text x="180" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Impact, 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="url(#logoSilver)" letter-spacing="2">AC</text>

    <!-- Tactical Checkered Racing / Military Stripe -->
    <g transform="translate(4, 82)">
      <!-- Checkered rhomboids -->
      <polygon points="0,0 8,0 4,8 -4,8" fill="#ef4444"/>
      <polygon points="11,0 19,0 15,8 7,8" fill="#ef4444"/>
      <polygon points="22,0 30,0 26,8 18,8" fill="#ef4444"/>
      <polygon points="33,0 41,0 37,8 29,8" fill="#ef4444"/>
      <polygon points="44,0 52,0 48,8 40,8" fill="#ef4444"/>
      <polygon points="55,0 63,0 59,8 51,8" fill="#ef4444"/>

      <!-- Subtitle -->
      <text x="74" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#94a3b8" letter-spacing="2.5">ANTICHEAT</text>
    </g>
  </g>
</svg>
